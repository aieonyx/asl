[package]
name = "asl-haniel"
version = "0.1.0"
edition = "2021"
authors = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license = "Apache-2.0"
description = "HANIEL PD — sovereign render surface replacing WebKitGTK in Onyxia Browser PD"

[dependencies]
asl-common = { path = "../asl-common" }

[dev-dependencies]
# none — integration tests use only asl-haniel and asl-common

[features]
default = []
kani = []
std = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
