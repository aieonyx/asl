# Default build target for production bare-metal builds.
# Tests override this via --target x86_64-unknown-linux-gnu explicitly.

[target.aarch64-unknown-none]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "link-arg=-nostartfiles",
]

[target.x86_64-unknown-linux-gnu]
rustflags = []
