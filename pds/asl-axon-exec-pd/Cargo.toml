[package]
name        = "asl-axon-exec-pd"
version     = "0.1.0"
edition     = "2021"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "Apache-2.0"
description = "AXON-Exec PD — sovereign .ax scripts in isolated seL4 Protection Domain"

[dependencies]
