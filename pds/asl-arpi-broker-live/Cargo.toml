[package]
name        = "asl-arpi-broker-live"
version     = "0.1.0"
edition     = "2021"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "Apache-2.0"
description = "ARPi-Broker Live — wired inter-PD IPC through ARPi 5-layer auth"

[dependencies]
